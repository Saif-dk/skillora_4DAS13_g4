server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: payment-service            # name registered in Eureka

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate             # schema is owned by Flyway (db/migration)

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm that signs the JWTs (public keys are fetched lazily on the first request)
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/elearning}

  mvc:
    problemdetails:
      enabled: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

# Service discovery (Eureka). Disabled by default so the service starts standalone.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Direct URL of the Course service. Leave empty to resolve "course-service" through Eureka.
clients:
  course-service:
    url: ${COURSE_SERVICE_URL:}

payment:
  provider: ${PAYMENT_PROVIDER:simulated}
  currency: ${PAYMENT_CURRENCY:EUR}
  exchange: payment.events
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:change-me}
  checkout-base-url: ${PAYMENT_CHECKOUT_URL:http://localhost:4200/checkout}
  pending-expiry-minutes: 30
  expiry-check-interval-ms: 60000
  outbox:
    poll-interval-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info
