# ===========================
# FORUM SERVICE - Configuration
# ===========================

spring.application.name=FORUM-SERVICE
server.port=8088

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/elearning_forum

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# JWT (same secret as user-service, verification only)
app.jwt.secret=ChangeMeWithAVeryLongSecretKey_AtLeast32Chars!

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
