spring.application.name=COMPLAINT-SERVICE
server.port=8087

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/elearning_complaints?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# JWT Secret (must be identical to user-service)
app.jwt.secret=ChangeMeWithAVeryLongSecretKey_AtLeast32Chars!

# Actuator
management.endpoints.web.exposure.include=health,info
