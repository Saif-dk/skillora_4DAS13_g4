spring:
  application:
    name: skillora-course-service
  datasource:
    url: jdbc:h2:file:./data/course-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8082

jwt:
  secret: skillora-user-service-local-development-secret-key-change-me-please
  expiration-ms: 86400000
  issuer: skillora-user-service

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SKILLORA_COURSE_DB_URL:jdbc:postgresql://localhost:5432/skillora_course}
    driver-class-name: org.postgresql.Driver
    username: ${SKILLORA_COURSE_DB_USER:skillora}
    password: ${SKILLORA_COURSE_DB_PASSWORD:skillora}
