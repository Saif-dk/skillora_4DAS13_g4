spring:
  application:
    name: skillora-course-service
  datasource:
    url: ${COURSE_DB_URL:jdbc:mysql://localhost:3306/gestion_cours?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${COURSE_DB_USER:root}
    password: ${COURSE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

skillora:
  uploads:
    dir: ./uploads

jwt:
  secret: skillora-user-service-local-development-secret-key-change-me-please
  expiration-ms: 86400000
  issuer: skillora-user-service

management:
  endpoints:
    web:
      exposure:
        include: health

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SKILLORA_COURSE_DB_URL:jdbc:postgresql://localhost:5432/skillora_course}
    driver-class-name: org.postgresql.Driver
    username: ${SKILLORA_COURSE_DB_USER:skillora}
    password: ${SKILLORA_COURSE_DB_PASSWORD:skillora}
